<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kamal Power Laundry | Shop desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="loginView" class="login-view">
      <div class="login-art">
        <div class="art-copy">
          <h1>Clean clothes.<br /><em>Clear mind.</em></h1>
          <p>A calm, capable desk for Kamal Power Laundry.</p>
        </div>
        <div class="art-stamp">
          KPL<br /><small>CARE · PRESS · RETURN</small>
        </div>
      </div>
      <form id="loginForm" class="login-card">
        <div class="brand-mark" aria-label="Kamal Power Laundry logo">KPL</div>
        <span class="eyebrow">SHOP DESK</span>
        <h2>Welcome back</h2>
        <p class="muted">Sign in to manage today’s laundry queue.</p>
        <label
          >Owner email or username<input
            id="loginUsername"
            type="text"
            value="owner"
            autocomplete="username"
            required
        /></label>
        <label
          >Password<input
            id="loginPassword"
            type="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
        /></label>
        <button class="button primary wide" type="submit">
          Enter shop desk <span>→</span>
        </button>
      </form>
    </div>

    <div id="appView" class="app-view hidden">
      <aside class="sidebar">
        <div class="side-brand">
          <div class="brand-mark" aria-label="Kamal Power Laundry logo">
            KPL
          </div>
          <div>
            <strong>Kamal Power</strong><small>Laundry shop desk</small>
          </div>
        </div>
        <nav id="mainNav">
          <button class="nav-item active" data-view="dashboard">
            <span class="nav-icon">▦</span>Overview
          </button>
          <button class="nav-item" data-view="billing">
            <span class="nav-icon">＋</span>New order <kbd>N</kbd>
          </button>
          <button class="nav-item" data-view="orders">
            <span class="nav-icon">≡</span>Orders
          </button>
          <button class="nav-item" data-view="customers">
            <span class="nav-icon">◉</span>Customers
          </button>
          <button class="nav-item" data-view="services">
            <span class="nav-icon">◇</span>Services & prices
          </button>
          <button class="nav-item" data-view="inventory">
            <span class="nav-icon">□</span>Inventory
          </button>
        </nav>
        <div class="sidebar-bottom">
          <div class="shop-status">
            <span></span>
            <div>
              <strong>Shop open</strong><small>Today · 08:00–19:00</small>
            </div>
          </div>
          <button id="logoutButton" class="logout">↪ Sign out</button>
        </div>
      </aside>
      <main class="main-content">
        <header class="topbar">
          <div>
            <span class="eyebrow" id="pageKicker"
              >WEDNESDAY, 30 SEPTEMBER 2026</span
            >
            <h1 id="pageTitle">Good morning, Kamal</h1>
          </div>
          <div class="top-actions">
            <button
              class="icon-button"
              id="globalSearchButton"
              title="Search orders"
            >
              ⌕</button
            ><button class="button primary" data-view="billing">
              ＋ <span>New order</span>
            </button>
            <div class="avatar">K</div>
          </div>
        </header>
        <div id="content" class="content"></div>
      </main>
    </div>
    <div id="modalRoot"></div>
    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
  </body>
</html>
